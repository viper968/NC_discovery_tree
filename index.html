<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodeCore Discovery Tree</title>
<meta name="description" content="An explorable map of NodeCore's hint progression, with an optional spoiler-free mode that reveals the tree one discovery at a time.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%221%22 width=%2214%22 height=%2214%22 rx=%222%22 fill=%22%23b5561b%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>NodeCore Discovery Tree</h1>
    <span class="progress" id="progress">0 / 0 discovered</span>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="Search discoveries…" autocomplete="off" aria-label="Search discoveries">
    <ul id="results" class="results" hidden></ul>
  </div>
  <div class="controls">
    <label class="switch" title="Hide everything you haven't unlocked yet">
      <input type="checkbox" id="spoilers">
      <span class="track"><span class="thumb"></span></span>
      <span>Spoilers mode</span>
    </label>
    <div class="zoom" role="group" aria-label="Zoom">
      <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zoomFit" title="Fit to screen">Fit</button>
      <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
    </div>
    <button id="reset" class="ghost" title="Forget everything you've marked as discovered">Reset progress</button>
  </div>
</header>

<div id="focusBar" class="focusbar" hidden>
  Showing only what's needed for <strong id="focusName"></strong>
  <button id="focusClear" class="ghost small">Show everything</button>
</div>

<main class="layout">
  <div id="viewport" class="viewport" tabindex="0" aria-label="Discovery tree">
    <div id="stage" class="stage">
      <div id="canvas" class="canvas"></div>
    </div>
    <div id="loading" class="loading">Loading discovery data…</div>
  </div>
  <aside id="details" class="details" aria-live="polite"></aside>
</main>

<script src="app.js"></script>
</body>
</html>
